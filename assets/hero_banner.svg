<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d11"/>
      <stop offset="50%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="spotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760"/>
      <stop offset="100%" stop-color="#1db954"/>
    </linearGradient>
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b"/>
      <stop offset="100%" stop-color="#ff0033"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  
  <!-- Ambient background glow circles -->
  <circle cx="200" cy="180" r="140" fill="#ff0033" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="220" r="160" fill="#1db954" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="100" r="100" fill="#8b5cf6" opacity="0.08" filter="url(#glow)"/>

  <!-- Brand Title -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Icon pill -->
    <rect x="-110" y="-70" width="220" height="50" rx="25" fill="#1e2430" stroke="#333c4d" stroke-width="1.5"/>
    <text x="-55" y="-38" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="22" fill="#ff0033">▶</text>
    <text x="0" y="-38" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="20" fill="#64748b">⇄</text>
    <text x="55" y="-38" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="24" fill="#1db954">●</text>

    <!-- Main Title -->
    <text y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5">
      Tubify
    </text>

    <!-- Subtitle -->
    <text y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      YouTube → Spotify Personal Music Organizer &amp; Mood Classifier
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(600, 310)" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">
    <rect x="-420" y="0" width="180" height="40" rx="20" fill="#181b22" stroke="#272c38"/>
    <text x="-330" y="25" fill="#e2e8f0">🎯 Noise Stripper</text>

    <rect x="-210" y="0" width="200" height="40" rx="20" fill="#181b22" stroke="#272c38"/>
    <text x="-110" y="25" fill="#e2e8f0">🎧 Spotify Search &amp; Match</text>

    <rect x="20" y="0" width="180" height="40" rx="20" fill="#181b22" stroke="#272c38"/>
    <text x="110" y="25" fill="#e2e8f0">🧠 TF-IDF Mood NLP</text>

    <rect x="230" y="0" width="190" height="40" rx="20" fill="#181b22" stroke="#272c38"/>
    <text x="325" y="25" fill="#e2e8f0">📊 Taste Personalization</text>
  </g>
</svg>
